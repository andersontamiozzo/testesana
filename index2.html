<body>

    <!-- Seu Script Google -->
    <iframe src="https://script.google.com/macros/s/AKfycbzQPun9he-vKKw_Qm9qEVgebUjHJUY2AOjWP-6x34y_rjcctShJSLJwCq4nV4iBzAce/exec" title="App"></iframe>

    <!-- JS da Biblioteca -->
    <script src="https://cdn.jsdelivr.net/gh/philfung/add-to-homescreen@3.4/dist/add-to-homescreen.min.js"></script>

    <script>
        // 1. REGISTRO FALSO DO SERVICE WORKER (Para enganar o Android)
        // Sem isso, o Android nem considera o site um "App"
        if ('serviceWorker' in navigator) {
           navigator.serviceWorker.register('sw.js').catch(() => console.log('SW pulado'));
        }

        // 2. CONFIGURAÇÃO DA BIBLIOTECA
        document.addEventListener('DOMContentLoaded', function () {
            window.AddToHomeScreenInstance = window.AddToHomeScreen({
                appName: 'Fretes Sana',  // Nome no aviso
                appNameDisplay: 'standalone',
                showArrow: true,         // Mostra seta apontando para o menu
                startDelay: 2,           // Espera 2 segundos antes de aparecer
                lifespan: 0,             // 0 = Aparece SEMPRE (para teste). Mude para 15 depois.
                skipFirstVisit: false,   // Mostra logo na primeira visita
                maxDisplayCount: 0       // 0 = Sem limite de vezes
            });
            
            // Força mostrar o aviso (útil se o automático falhar)
            window.AddToHomeScreenInstance.show();
        });
    </script>
</body>
